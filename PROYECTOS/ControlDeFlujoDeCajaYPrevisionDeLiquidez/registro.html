<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear perfil | Flujo de caja</title>
    <link rel="stylesheet" href="estilos.css">
    <script type="module" src="js/acceso.js"></script>
</head>
<body>
    <main class="acceso">
        <header class="cabecera">
            <h1>Crear perfil</h1>
        </header>
        <section>
            <form id="formulario-acceso" data-modo="registro">
                <label>Nombre
                    <input name="nombre" autocomplete="name" minlength="2" maxlength="60" required>
                </label>
                <label>Correo electrónico
                    <input type="email" name="correo" autocomplete="username" maxlength="120" required>
                </label>
                <label>Clave
                    <input type="password" name="clave" autocomplete="new-password" minlength="8" maxlength="64"
                           aria-describedby="ayuda-clave" required>
                </label>
                <p class="ayuda" id="ayuda-clave">De 8 a 64 caracteres. Incluye mayúscula, minúscula y número. Usa una clave de prueba y evita espacios.</p>
                <label>Confirmar clave
                    <input type="password" name="confirmacion" autocomplete="new-password" maxlength="64" required>
                </label>
                <p id="mensaje" role="status"></p>
                <button type="submit" class="principal">Registrarme</button>
            </form>
            <p><a href="login.html">Volver a iniciar sesión</a></p>
        </section>
    </main>
</body>
</html>
