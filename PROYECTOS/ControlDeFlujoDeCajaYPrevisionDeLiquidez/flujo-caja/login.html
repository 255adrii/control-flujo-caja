<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | Flujo de caja</title>
    <link rel="stylesheet" href="estilos.css">
    <script type="module" src="js/acceso.js"></script>
</head>
<body>
    <main class="acceso">
        <header class="cabecera">
            <h1>Iniciar sesión</h1>
        </header>
        <section>
            <form id="formulario-acceso" data-modo="login">
                <label>Correo electrónico
                    <input type="email" name="correo" autocomplete="username" maxlength="120" required>
                </label>
                <label>Clave
                    <input type="password" name="clave" autocomplete="current-password" minlength="8" maxlength="64" required>
                </label>
                <p id="mensaje" role="status"></p>
                <button type="submit" class="principal">Entrar</button>
            </form>
            <p>¿Todavía no tienes perfil? <a href="registro.html">Crear perfil</a></p>
            <aside class="demo">
                <strong>Perfil de demostración</strong>
                <p>Correo <code>demo@ejemplo.com</code><br>Clave <code>DemoCaja2026</code></p>
            </aside>
        </section>
    </main>
</body>
</html>
