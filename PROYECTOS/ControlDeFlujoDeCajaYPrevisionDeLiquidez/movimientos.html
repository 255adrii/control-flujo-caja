<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Movimientos | Flujo de caja</title>
    <link rel="stylesheet" href="estilos.css">
    <script type="module" src="js/movimientos.js"></script>
</head>
<body>
    <menu-principal pagina="Movimientos"></menu-principal>
    <main hidden>
        <header class="cabecera">
            <h1>Movimientos</h1>
        </header>
        <section>
            <h2 id="titulo-formulario">Nuevo movimiento</h2>
            <form id="formulario-movimiento">
                <div class="campos">
                    <label>Cuenta <select name="cuenta" required></select></label>
                    <label>Concepto <input name="concepto" maxlength="100" required></label>
                    <label>Tipo
                        <select name="tipo" required>
                            <option value="cobro">Cobro</option><option value="pago">Pago</option>
                        </select>
                    </label>
                    <label>Importe (€) <input type="number" name="importe" min="0.01" step="0.01" required></label>
                    <label>Fecha prevista <input type="date" name="fechaPrevista" required></label>
                    <label>Fecha real <input type="date" name="fechaReal" aria-describedby="ayuda-fecha"></label>
                </div>
                <p class="ayuda" id="ayuda-fecha">Deja la fecha real vacía si el cobro o pago sigue pendiente.</p>
                <div class="acciones">
                    <button type="submit" class="principal">Guardar movimiento</button>
                    <button type="button" id="cancelar" hidden>Cancelar edición</button>
                </div>
            </form>
            <p id="mensaje" role="status"></p>
        </section>
        <section>
            <h2>Listado de movimientos</h2>
            <form class="campos" id="filtros">
                <label>Buscar por concepto <input type="search" name="buscar"></label>
                <label>Filtrar por cuenta <select name="cuenta"></select></label>
                <label>Filtrar por tipo
                    <select name="tipo">
                        <option value="">Todos</option><option value="cobro">Cobros</option><option value="pago">Pagos</option>
                    </select>
                </label>
                <label>Filtrar por estado
                    <select name="estado">
                        <option value="">Todos</option><option>Pendiente</option><option>Realizado</option><option>Vencido</option>
                    </select>
                </label>
                <label>Ordenar por
                    <select name="orden">
                        <option value="fecha">Fecha prevista (reciente primero)</option>
                        <option value="importe">Importe (mayor primero)</option>
                        <option value="concepto">Concepto (A–Z)</option>
                    </select>
                </label>
            </form>
            <div class="tabla-scroll">
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Concepto</th><th scope="col">Cuenta</th><th scope="col">Tipo</th>
                            <th scope="col">Importe</th><th scope="col">Fecha prevista</th>
                            <th scope="col">Estado</th><th scope="col">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="filas-movimientos"></tbody>
                </table>
            </div>
        </section>
        
        <dialog id="detalle" aria-labelledby="titulo-detalle">
            <h2 id="titulo-detalle">Detalles</h2>
            <dl></dl>
            <form method="dialog"><button type="submit">Cerrar</button></form>
        </dialog>
    </main>
</body>
</html>
